<!DOCTYPE html>
<html>
    <head>
        <script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
        <link rel="stylesheet" href="/static/fonts.css">
        <link rel="stylesheet" href="/static/fa/icons.css">
        {{if .debug}}
        <link rel="stylesheet/less" href="/static/style.less">
        <script src="/static/js/less.js"></script>
        {{else}}
        <link rel="stylesheet" href="/static/style.css">
        {{end}}
        <script src="/static/js/cash.min.js"></script>
        <script src="/static/js/theme.js"></script>
        <script src="/static/js/paginator.js"></script>
        <script src="/static/js/flash.js"></script>
        <script src="/static/js/admin.js"></script>
        <script src="/static/js/split-grid.min.js"></script>
        <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script> -->
        <title>{{.title}}</title>
    </head>
    <body>
        <button type="button" class="theme-toggle" title="Switch between light and dark" aria-label="Switch between light and dark"><i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i></button>
        <div class="content">
            <div class="container admin {{.extraContainerClass}}">
                {{.body}}
            </div>
        </div>
        <div class="footer">
          <div class="container">
            <div class="user-controls">
              <a href="/admin/users/">users <i class="fa-solid fa-users"></i></a>
            </div>
            <div class="admin-controls">
              <a href="/admin/">home <i class="fa-solid fa-house"></i></a> or
              <a href="/logout/">logout <i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
          </div>
        </div>
    </body>
</html>

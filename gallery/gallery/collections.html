<div class="gallery-bar">
<h2 class="gallery-views">
    <a href="/gallery/" title="grid view" aria-label="grid view"><i class="fa-solid fa-table-cells-large"></i></a>
    <a href="/gallery/#map" title="map view" aria-label="map view"><i class="fa-solid fa-map-location-dot"></i></a>
    <a href="/gallery/collections" aria-pressed="true" title="collections" aria-label="collections"><i class="fa-solid fa-layer-group"></i></a>
</h2>
</div>

{{if .collections}}
<div class="photo-grid collection-grid">
{{range $c := .collections}}
    <a class="photo-tile collection-tile" href="/gallery/collections/{{$c.Slug}}">
        {{if $c.Cover}}<img src="{{photoURL $c.Cover}}" alt="" loading="lazy">{{end}}
        <span class="collection-name">{{$c.Title}} <small>{{$c.Count}}</small></span>
    </a>
{{end}}
</div>
{{else}}
<p>There are no collections yet.</p>
{{end}}

<div class="photo-detail">
    {{if .photo.Title}}<h2><a href="/gallery/{{.photo.ID}}">{{.photo.Title}}</a></h2>{{end}}

    <a href="{{photoURL .photo.File}}"><img class="photo-large" src="{{photoURL .photo.DisplayFile}}" alt="{{if .photo.Title}}{{.photo.Title}}{{else}}{{.photo.Caption}}{{end}}"></a>

    {{if .photo.Caption}}<p class="photo-caption">{{.photo.Caption}}</p>{{end}}

    <div class="photo-info{{if .photo.HasGPS}} has-locator{{end}}">
        <div class="photo-data">
            <div class="photo-facts">{{range photoFactCols .photo}}<dl>{{range .}}<dt>{{.Label}}</dt><dd>{{.Value}}</dd>{{end}}</dl>{{end}}</div>
            {{with photoPosted .photo}}<p class="photo-posted">{{.}}</p>{{end}}
        </div>
        {{if .photo.HasGPS}}<div class="photo-locator" data-lat="{{.photo.Latitude}}" data-lng="{{.photo.Longitude}}"></div>{{end}}
    </div>
</div>
